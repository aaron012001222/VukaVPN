name: VukaVPN Build

on:
  push:
    branches: [main, vukavpn]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ---- Hiddify's standard prepare sequence ----
      - name: 1) flutter pub get
        run: flutter pub get

      - name: 2) Run code generation (freezed / drift / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 3) Generate translations (slang)
        run: dart run slang

      - name: Build APK (release, arm64-v8a)
        # Skip test step (no SENTRY_DSN secret needed for build itself)
        env:
          IS_GITHUB_ACTIONS: 1
          CHANNEL: dev
        run: |
          flutter build apk --release \
            --target=lib/main.dart \
            --target-platform=android-arm64 \
            --build-name=1.0.0 \
            --build-number=1 \
            --dart-define=sentry_dsn= \
            2>&1 | tail -60

      - name: Locate output
        if: always()
        run: |
          echo "=== build/app/outputs/flutter-apk/ ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "(no APK)"
          echo "=== find apk ==="
          find build -name "*.apk" 2>/dev/null

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VukaVPN-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create release (on tag)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          body: |
            # VukaVPN ${{ github.ref_name }}
            Beta build — install on Android (Unknown sources allowed)
