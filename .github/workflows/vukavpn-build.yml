name: VukaVPN Build

on:
  push:
    branches: [main, vukavpn]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: vukavpn-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'
  CORE_VERSION: '4.1.0'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: 1) flutter pub get
        run: flutter pub get

      - name: 2) build_runner (freezed / drift / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 3) slang (translations)
        run: dart run slang

      - name: 4) Download hiddify-core native libraries (.so)
        run: |
          mkdir -p android/app/libs
          echo "Fetching hiddify-lib-android.tar.gz for core.version=${CORE_VERSION}"
          curl -fL "https://github.com/hiddify/hiddify-core/releases/download/v${CORE_VERSION}/hiddify-lib-android.tar.gz" | tar xz -C android/app/libs/
          echo "===== android/app/libs after unpack ====="
          ls -la android/app/libs/
          find android/app/libs -maxdepth 3 -type f | head -30

      - name: Build APK (release, split-per-abi, all 3 arches)
        env:
          IS_GITHUB_ACTIONS: 1
          CHANNEL: prod
        run: |
          set -o pipefail
          flutter build apk --release \
            --target=lib/main_prod.dart \
            --split-per-abi \
            --target-platform=android-arm,android-arm64,android-x64 \
            --build-name=0.2.0 \
            --build-number=2 \
            --dart-define=sentry_dsn= 2>&1 | tail -120

      - name: Build universal APK (fat, for compatibility fallback)
        env:
          IS_GITHUB_ACTIONS: 1
          CHANNEL: prod
        run: |
          set -o pipefail
          flutter build apk --release \
            --target=lib/main_prod.dart \
            --target-platform=android-arm,android-arm64,android-x64 \
            --build-name=0.2.0 \
            --build-number=2 \
            --dart-define=sentry_dsn= 2>&1 | tail -80

      - name: Locate output
        if: always()
        run: |
          echo "=== build/app/outputs/flutter-apk/ ==="
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "(no APK)"
          echo "=== find all APKs ==="
          find build -name "*.apk" 2>/dev/null

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VukaVPN-android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create release (on tag)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          body: |
            # VukaVPN ${{ github.ref_name }}
            Beta build - install on Android (allow "Unknown sources").
