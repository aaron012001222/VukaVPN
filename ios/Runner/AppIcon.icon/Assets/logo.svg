<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- VukaVPN Icon v12 — 严格按参考图 1:1 还原
       Dark navy 圆角方形 + 大尺寸白色折纸鹤侧面 (头朝右) + 底部 V 融合 -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.22" r="0.95">
      <stop offset="0%"  stop-color="#3268c4"/>
      <stop offset="50%" stop-color="#1a3d8f"/>
      <stop offset="100%" stop-color="#0a1e4f"/>
    </radialGradient>

    <linearGradient id="paperHi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="paperMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6e0f0"/>
      <stop offset="100%" stop-color="#aebbd2"/>
    </linearGradient>
    <linearGradient id="paperShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a90b0"/>
      <stop offset="100%" stop-color="#4e6488"/>
    </linearGradient>
    <linearGradient id="vDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1e4f"/>
    </linearGradient>

    <radialGradient id="topGlare" cx="0.5" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- iOS rounded square background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <ellipse cx="512" cy="180" rx="420" ry="200" fill="url(#topGlare)"/>

  <!-- ========== 折纸鹤 — 大尺寸侧面, 头朝右 ========== -->
  <g transform="translate(512, 520)" filter="url(#softShadow)">

    <!-- ===== 主翼 (左上大三角, 占主要视觉) ===== -->
    <!-- 主翼上半亮面 -->
    <path d="M -360 -280
             L 80 -60
             L -60 30
             Z"
          fill="url(#paperHi)"/>

    <!-- 主翼下半中间色 (折叠面) -->
    <path d="M -360 -280
             L -60 30
             L -220 80
             L -340 -120
             Z"
          fill="url(#paperMid)"/>

    <!-- 主翼底部翼根阴影 -->
    <path d="M -220 80
             L -60 30
             L -100 130
             L -180 130
             Z"
          fill="url(#paperShadow)" opacity="0.85"/>

    <!-- 主翼内折线 (从翼根到翼尖) -->
    <line x1="-360" y1="-280" x2="-60" y2="30" stroke="#5a7caa" stroke-width="3" opacity="0.6"/>

    <!-- ===== 头 + 颈 + 喙 (右侧) ===== -->
    <!-- 颈上面亮 -->
    <path d="M 80 -60
             L 230 -210
             L 260 -180
             L 130 -10
             Z"
          fill="url(#paperHi)"/>

    <!-- 颈下面阴影 -->
    <path d="M 80 -60
             L 130 -10
             L 220 -150
             L 230 -210
             Z"
          fill="url(#paperMid)" opacity="0.85"/>

    <!-- 头 -->
    <path d="M 230 -210
             L 295 -220
             L 300 -180
             L 260 -180
             Z"
          fill="url(#paperHi)"/>

    <!-- 头阴影 -->
    <path d="M 260 -180
             L 300 -180
             L 285 -170
             L 268 -175
             Z"
          fill="url(#paperMid)"/>

    <!-- 喙 (尖锐向右) -->
    <path d="M 295 -220
             L 370 -200
             L 300 -180
             Z"
          fill="url(#paperShadow)"/>

    <!-- 鹤眼 (明显黑色圆点 + 高光) -->
    <circle cx="278" cy="-198" r="6" fill="#0a1e4f"/>
    <circle cx="280" cy="-201" r="2" fill="#ffffff" opacity="0.95"/>

    <!-- ===== 身体 (中央折面菱形) ===== -->
    <!-- 身体亮面 -->
    <path d="M 80 -60
             L 130 -10
             L 100 130
             L -60 30
             Z"
          fill="url(#paperHi)"/>

    <!-- 身体右侧阴影 -->
    <path d="M 130 -10
             L 100 130
             L 80 60
             L 105 20
             Z"
          fill="url(#paperMid)"/>

    <!-- 身体中线 -->
    <line x1="80" y1="-60" x2="100" y2="130" stroke="#aebbd2" stroke-width="2" opacity="0.6"/>

    <!-- ===== V 字融合 (鹤腹底部, 深蓝, 两条腿/尾) ===== -->
    <!-- V 左臂 -->
    <path d="M -60 30
             L -50 280
             L 30 180
             L 10 100
             Z"
          fill="url(#vDeep)"/>

    <!-- V 中部连接 -->
    <path d="M -60 30
             L 10 100
             L 100 130
             L 60 170
             L 30 180
             L -50 280
             Z"
          fill="url(#paperShadow)"/>

    <!-- V 右臂 (内侧深色) -->
    <path d="M 100 130
             L 130 290
             L 60 170
             Z"
          fill="url(#vDeep)"/>

    <!-- ===== 尾羽 (鹤后方简短) ===== -->
    <path d="M -340 -120
             L -390 -90
             L -340 -60
             L -310 -100
             Z"
          fill="url(#paperMid)"/>
    <path d="M -390 -90
             L -340 -60
             L -360 -70
             Z"
          fill="url(#paperShadow)" opacity="0.7"/>
  </g>
</svg>
